<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>چک لیست CCM</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family: sans-serif,Arial,sans-serif;
    background:#f2f4f7;
    color:#222;
}

body{
    overflow-x:hidden;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:12px;
}

/* HEADER */

.header{
    background:#fff;
    border-radius:18px;
    padding:14px;
    box-shadow:0 3px 14px rgba(0,0,0,.08);
    margin-bottom:12px;
}

.header-top{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.logo{
    width:200px;
    height:200px;
    object-fit:contain;
    border-radius:15px;
}

.title-area{
    text-align:center;
}

.title-area h1{
    margin:0 0 7px;
    font-size:24px;
    color:#173b68;
}

.developer{
    font-size:13px;
    color:#777;
}

/* ONLINE STATUS */

.connection{
    margin-top:12px;
    text-align:center;
    font-size:13px;
    padding:8px;
    border-radius:10px;
    background:#fff8dc;
    color:#856404;
}

.connection.online{
    background:#e8f8ee;
    color:#18733c;
}

.connection.error{
    background:#fdeaea;
    color:#a51d1d;
}

/* FORM CONTROLS */

.form-controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:14px;
}

.control-box{
    background:#f7f9fb;
    padding:10px;
    border-radius:12px;
}

.control-box label{
    display:block;
    font-size:13px;
    margin-bottom:6px;
    color:#555;
}

input,select{
    width:100%;
    height:44px;
    border:1px solid #d3d8df;
    border-radius:9px;
    padding:0 10px;
    background:white;
    font-family:inherit;
    font-size:15px;
}

input:focus,select:focus{
    outline:none;
    border-color:#3274c5;
    box-shadow:0 0 0 2px rgba(50,116,197,.12);
}

input[readonly]{
    background:#edf1f5;
}

/* BUTTONS */

.buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    margin-top:12px;
}

button{
    border:none;
    border-radius:10px;
    min-height:44px;
    padding:8px 12px;
    font-family:inherit;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.btn-save{
    background:#198754;
    color:white;
}

.btn-search{
    background:#1769aa;
    color:white;
}

.btn-clear{
    background:#dc3545;
    color:white;
}

button:active{
    transform:scale(.98);
}

/* ROLE CARD */

.role-card{
    background:white;
    border-radius:16px;
    margin-bottom:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
    overflow:hidden;
}

.role-header{
    width:100%;
    border-radius:0;
    background:#173b68;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    text-align:right;
    padding:15px;
    min-height:52px;
}

.role-header span:last-child{
    font-size:13px;
    opacity:.9;
}

.role-content{
    display:none;
    padding:10px;
}

.role-content.open{
    display:block;
}

/* SHIFT */

.shift-box{
    border:1px solid #dfe4e9;
    border-radius:12px;
    overflow:hidden;
    margin-bottom:10px;
}

.shift-header{
    background:#eef3f8;
    padding:12px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:bold;
    color:#173b68;
}

.shift-content{
    display:none;
    padding:10px;
}

.shift-content.open{
    display:block;
}

/* EMPLOYEE */

.employee-box{
    margin-bottom:10px;
}

.employee-box label{
    display:block;
    margin-bottom:6px;
    font-size:13px;
    color:#555;
}

/* CHECKLIST TABLE */

/*
    مهم:
    عرض جدول دقیقاً برابر عرض والد است.
    ستون مورد بررسی بزرگ است.
    ستون وضعیت باریک است.
    بنابراین در موبایل اسکرول افقی ایجاد نمی‌شود.
*/

.table-wrapper{
    width:100%;
    overflow:hidden;
}

.checklist-table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

.checklist-table th,
.checklist-table td{
    border:1px solid #d9dee4;
    padding:8px 6px;
    vertical-align:middle;
    word-wrap:break-word;
    overflow-wrap:anywhere;
}

.checklist-table th{
    background:#173b68;
    color:white;
    font-size:13px;
}

.checklist-table th:nth-child(1),
.checklist-table td:nth-child(1){
    width:12%;
    text-align:center;
}

.checklist-table th:nth-child(2),
.checklist-table td:nth-child(2){
    width:63%;
    text-align:right;
}

.checklist-table th:nth-child(3),
.checklist-table td:nth-child(3){
    width:35%;
    text-align:center;
}

/* STATUS */

.status-cell{
    text-align:center !important;
}

.status-options{
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:center;
    gap:8px;
    white-space:nowrap;
}
.status-option{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    font-size:12px;
    white-space:nowrap;
    cursor:pointer;
}

.status-option input{
    width:17px;
    height:17px;
    margin:0;
    padding:0;
    cursor:pointer;
}

/* DESCRIPTION */
.shift-save-area{display:flex;justify-content:center;margin-top:14px;padding-top:4px;}
.shift-save-btn{width:100%;max-width:320px;}
.shift-save-btn:disabled{opacity:.7;cursor:not-allowed;}

.description-box{margin:10px 0;}
.description-box label{display:block;margin-bottom:6px;font-size:13px;color:#555;}
.description-box textarea{width:100%;min-height:75px;resize:vertical;border:1px solid #d3d8df;border-radius:9px;padding:9px 10px;font-family:inherit;font-size:14px;background:#fff;}
.description-box textarea:focus{outline:none;border-color:#3274c5;box-shadow:0 0 0 2px rgba(50,116,197,.12);}
.form-locked{opacity:.75;}
button:disabled,input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.65;}

/* SEARCH */

.search-panel{
    display:none;
    background:white;
    border-radius:15px;
    padding:12px;
    margin-bottom:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.search-panel.open{
    display:block;
}

.search-item{
    border:1px solid #ddd;
    border-radius:10px;
    padding:10px;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.search-info{
    font-size:13px;
}

.search-load{
    background:#1769aa;
    color:white;
    min-height:38px;
    padding:5px 10px;
}

/* LOADING */

.loading{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

.loading.show{
    display:flex;
}

.loading-box{
    background:white;
    border-radius:14px;
    padding:22px 30px;
    text-align:center;
    box-shadow:0 5px 25px rgba(0,0,0,.2);
}

.spinner{
    width:35px;
    height:35px;
    border:4px solid #ddd;
    border-top-color:#1769aa;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 12px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* MESSAGE */

.message{
    position:fixed;
    bottom:18px;
    right:18px;
    left:18px;
    max-width:500px;
    margin:auto;
    background:#173b68;
    color:white;
    padding:12px 15px;
    border-radius:11px;
    text-align:center;
    display:none;
    z-index:10000;
    box-shadow:0 4px 15px rgba(0,0,0,.2);
}

.message.show{
    display:block;
}

/* MOBILE */

@media(max-width:600px){

    .container{
        padding:8px;
    }

    .header{
        border-radius:14px;
        padding:10px;
    }

    .header-top{
        gap:8px;
    }

    .logo{
        width:150px;
        height:180px;
    }

    .title-area h1{
        font-size:19px;
    }

    .developer{
        font-size:11px;
    }

    .form-controls{
        grid-template-columns:1fr 1fr;
        gap:7px;
    }

    .control-box{
        padding:7px;
    }

    .control-box label{
        font-size:11px;
    }

    input,select{
        height:40px;
        font-size:13px;
    }

    .buttons{
        grid-template-columns:1fr;
        gap:7px;
    }

    .buttons button{
        min-height:42px;
    }

    .role-header{
        padding:13px 11px;
        font-size:14px;
    }

    .role-content{
        padding:7px;
    }

    .shift-header{
        font-size:13px;
        padding:11px 9px;
    }

    .shift-content{
        padding:7px;
    }

    .checklist-table th,
    .checklist-table td{
        padding:7px 4px;
        font-size:12px;
    }

    .checklist-table th:nth-child(1),
    .checklist-table td:nth-child(1){
        width:11%;
    }

    .checklist-table th:nth-child(2),
    .checklist-table td:nth-child(2){
        width:54%;
    }

    .checklist-table th:nth-child(3),
    .checklist-table td:nth-child(3){
        width:25%;
    }

    .status-option{
        font-size:10px;
        gap:3px;
    }

    .status-option input{
        width:15px;
        height:15px;
    }

    .description-box textarea{min-height:65px;font-size:13px;}

    .search-item{
        flex-direction:column;
        align-items:stretch;
        text-align:center;
    }
}

/* VERY SMALL PHONES */

@media(max-width:360px){

    .title-area h1{
        font-size:17px;
    }

    .checklist-table th,
    .checklist-table td{
        font-size:11px;
        padding:6px 3px;
    }

    .status-option{
        font-size:9px;
    }

    .status-option input{
        width:14px;
        height:14px;
    }
}

/* ACCESS CONTROL */
.login-screen{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(135deg,#173b68,#3274c5);
}
.login-box{
    width:100%;
    max-width:380px;
    background:#fff;
    border-radius:22px;
    padding:28px 22px;
    box-shadow:0 12px 40px rgba(0,0,0,.25);
    text-align:center;
}
.login-box h2{
    margin:0 0 8px;
    color:#173b68;
}
.login-box p{
    margin:0 0 20px;
    color:#777;
    font-size:13px;
}
.login-box input{
    text-align:center;
    letter-spacing:8px;
    font-size:22px;
    font-weight:bold;
}
.login-btn{
    width:100%;
    margin-top:12px;
    background:#198754;
    color:#fff;
}
.login-error{
    min-height:22px;
    margin-top:10px;
    color:#b42318;
    font-size:13px;
}
.role-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:10px;
    padding:7px 12px;
    border-radius:999px;
    background:#eaf2ff;
    color:#173b68;
    font-size:12px;
    font-weight:bold;
}
.logout-btn{
    background:#dc3545;
    color:#fff;
    min-height:38px;
    padding:6px 12px;
    font-size:12px;
}
.manager-only{
    display:none;
}

</style>
</head>

<body>

<!-- ACCESS LOGIN -->
<div id="loginScreen" class="login-screen">
    <div class="login-box">
        <h2>سیستم CCM</h2>
        <p>برای ورود، رمز ۴ رقمی خود را وارد کنید</p>

        <input
            id="accessPassword"
            type="password"
            inputmode="numeric"
            maxlength="4"
            autocomplete="off"
            placeholder="••••"
            onkeydown="if(event.key==='Enter') login()"
        >

        <button class="login-btn" onclick="login()">
            🔐 ورود
        </button>

        <div id="loginError" class="login-error"></div>
    </div>
</div>

/* =========================================================
   DATE → FORM NUMBER CALCULATION
========================================================= */

function getFormNumberFromDate(dateString){

    const match = dateString.match(/^1405\/(\d{2})\/(\d{2})$/);
    if(!match) return "";

    const month = parseInt(match[1]);
    const day = parseInt(match[2]);
    const monthDays = [31,31,31,31,31,31,30,30,30,30,30,29];

    if(month < 1 || month > 12) return "";
    if(day < 1 || day > monthDays[month - 1]) return "";

    let formNumber = day;
    for(let i=0;i<month-1;i++) formNumber += monthDays[i];

    return formNumber;
}

function gregorianToJalali(gy, gm, gd){

    const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];

    let jy = (gy <= 1600) ? 0 : 979;
    gy -= (gy <= 1600) ? 621 : 1600;

    const gy2 = (gm > 2) ? gy + 1 : gy;

    let days = (365 * gy)
        + Math.floor((gy2 + 3) / 4)
        - Math.floor((gy2 + 99) / 100)
        + Math.floor((gy2 + 399) / 400)
        - 80 + gd + g_d_m[gm - 1];

    jy += 33 * Math.floor(days / 12053);
    days %= 12053;
    jy += 4 * Math.floor(days / 1461);
    days %= 1461;

    if(days > 365){
        jy += Math.floor((days - 1) / 365);
        days = (days - 1) % 365;
    }

    const jm = days < 186
        ? 1 + Math.floor(days / 31)
        : 7 + Math.floor((days - 186) / 30);

    const jd = 1 + (days < 186
        ? days % 31
        : (days - 186) % 30);

    return {year:jy,month:jm,day:jd};
}

function getTodayJalali(){

    const now = new Date();

    const j = gregorianToJalali(
        now.getFullYear(),
        now.getMonth()+1,
        now.getDate()
    );

    return String(j.year).padStart(4,"0") + "/" +
           String(j.month).padStart(2,"0") + "/" +
           String(j.day).padStart(2,"0");
}

function setTodayDate(){

    const today = getTodayJalali();

    document.getElementById("formDate").value = today;
    document.getElementById("formNumber").value =
        getFormNumberFromDate(today);
}

/* =========================================================
   DAILY ACCESS / VALIDATION
========================================================= */

function getSavedRoles(data){

    if(!data || typeof data !== "object") return {};
    if(!data._ccmMeta || typeof data._ccmMeta !== "object") return {};

    return (data._ccmMeta.savedRoles &&
            typeof data._ccmMeta.savedRoles === "object")
        ? data._ccmMeta.savedRoles
        : {};
}

function getSavedShifts(data){

    if(!data || typeof data !== "object") return {};
    if(!data._ccmMeta || typeof data._ccmMeta !== "object") return {};

    return (data._ccmMeta.savedShifts &&
            typeof data._ccmMeta.savedShifts === "object")
        ? data._ccmMeta.savedShifts
        : {};
}

function validateShiftBeforeSave(roleId, shift, data){

    const fields = data.fields || {};
    const radios = data.radios || {};
    const role = roles.find(r => r.id === roleId);

    if(!role){
        return {ok:false,message:"نقش انتخاب‌شده معتبر نیست."};
    }

    const employeeKey = `${roleId}_${shift}_employee`;

    if(!fields[employeeKey]){
        return {
            ok:false,
            message:`نام پرسنل شیفت ${shift === "day" ? "روز" : "شب"} انتخاب نشده است.`
        };
    }

    for(let i=0;i<role.items.length;i++){

        const key = `${roleId}_${shift}_item_${i}`;

        if(!radios[key]){
            return {
                ok:false,
                message:`تمام گزینه‌های چک‌لیست شیفت ${shift === "day" ? "روز" : "شب"} باید تعیین وضعیت شوند. مورد شماره ${i+1} تکمیل نشده است.`
            };
        }
    }

    return {ok:true};
}

function lockShift(roleId, shift){

    if(!currentAccess ||
       currentAccess.role === "manager" ||
       currentAccess.role === "supervisor") return;

    document.querySelectorAll(
        `[data-field^="${roleId}_${shift}_"], input[type="radio"][data-radio^="${roleId}_${shift}_"]`
    ).forEach(el => el.disabled = true);

    const button = document.querySelector(
        `[data-shift-save="${roleId}_${shift}"]`
    );

    if(button){
        button.disabled = true;
        button.innerHTML = `✅ شیفت ${shift === "day" ? "روز" : "شب"} ثبت شده`;
    }
}

function lockCurrentRole(){

    if(!currentAccess ||
       currentAccess.role === "manager" ||
       currentAccess.role === "supervisor") return;

    const roleId = currentAccess.role;
    const savedShifts = window._ccmSavedShifts || {};

    ["day","night"].forEach(shift => {
        if(savedShifts[`${roleId}_${shift}`]){
            lockShift(roleId, shift);
        }
    });
}

async function checkTodayRoleSaved(){

    if(!currentAccess ||
       currentAccess.role === "manager" ||
       currentAccess.role === "supervisor") return false;

    const formNumber = document.getElementById("formNumber").value;
    const formDate = document.getElementById("formDate").value;

    try{

        const {data,error} = await supabaseClient
            .from("ccm_forms")
            .select("data")
            .eq("form_number",String(formNumber))
            .eq("form_date",formDate)
            .maybeSingle();

        if(error) throw error;

        const formData = data ? data.data : null;
        const savedShifts = getSavedShifts(formData);
        const savedRoles = getSavedRoles(formData);

        window._ccmSavedShifts = savedShifts;

        // سازگاری با نسخه قبلی: اگر نقش قبلاً کامل ثبت شده باشد، هر دو شیفت قفل شوند.
        if(savedRoles[currentAccess.role]){
            ["day","night"].forEach(shift => {
                savedShifts[`${currentAccess.role}_${shift}`] = savedRoles[currentAccess.role];
            });
            window._ccmSavedShifts = savedShifts;
        }

        ["day","night"].forEach(shift => {
            if(savedShifts[`${currentAccess.role}_${shift}`]){
                lockShift(currentAccess.role, shift);
            }
        });

        return Boolean(
            savedShifts[`${currentAccess.role}_day`] ||
            savedShifts[`${currentAccess.role}_night`]
        );

    }catch(error){
        console.error(error);
    }

    return false;
}

/* =========================================================
   SAVE SHIFT
========================================================= */

async function saveShift(roleId, shift){

    if(!currentAccess){
        alert("ابتدا وارد سیستم شوید.");
        return;
    }

    if(currentAccess.role !== roleId){
        alert("شما اجازه ثبت این بخش را ندارید.");
        return;
    }

    if(currentAccess.role === "manager" ||
       currentAccess.role === "supervisor"){
        alert("این سطح دسترسی برای مشاهده است و ثبت مستقیم انجام نمی‌دهد.");
        return;
    }

    const formNumber = document.getElementById("formNumber").value;
    const formDate = document.getElementById("formDate").value;
    const button = document.querySelector(`[data-shift-save="${roleId}_${shift}"]`);

    showLoading();

    try{

        const finalData = collectFormData();
        const validation = validateShiftBeforeSave(roleId, shift, finalData);

        if(!validation.ok){
            alert("⚠️ " + validation.message);
            return;
        }

        const {data:existing,error:existingError} =
            await supabaseClient
                .from("ccm_forms")
                .select("data")
                .eq("form_number",String(formNumber))
                .eq("form_date",formDate)
                .maybeSingle();

        if(existingError) throw existingError;

        const existingData =
            existing && existing.data ? existing.data : {};

        const savedShifts = getSavedShifts(existingData);
        const shiftKey = `${roleId}_${shift}`;

        if(savedShifts[shiftKey]){
            lockShift(roleId, shift);
            alert(`شیفت ${shift === "day" ? "روز" : "شب"} امروز قبلاً ذخیره شده است و امکان ثبت مجدد ندارد.`);
            return;
        }

        // فقط اطلاعات همین شیفت از فرم فعلی ذخیره/به‌روزرسانی می‌شود.
        const shiftPrefix = `${roleId}_${shift}_`;
        const shiftFields = {};
        const shiftRadios = {};

        Object.entries(finalData.fields || {}).forEach(([key,value]) => {
            if(key.startsWith(shiftPrefix)) shiftFields[key] = value;
        });

        Object.entries(finalData.radios || {}).forEach(([key,value]) => {
            if(key.startsWith(shiftPrefix)) shiftRadios[key] = value;
        });

        const mergedData = {
            fields:{
                ...(existingData.fields || {}),
                ...shiftFields
            },
            radios:{
                ...(existingData.radios || {}),
                ...shiftRadios
            },
            _ccmMeta:{
                ...(existingData._ccmMeta || {}),
                savedShifts:{
                    ...savedShifts,
                    [shiftKey]:{
                        title:currentAccess.title,
                        shift:shift,
                        savedAt:new Date().toISOString()
                    }
                }
            }
        };

        const {error} = await supabaseClient
            .from("ccm_forms")
            .upsert({
                form_number:String(formNumber),
                form_date:formDate,
                data:mergedData,
                updated_at:new Date().toISOString()
            },{
                onConflict:"form_number,form_date"
            });

        if(error) throw error;

        window._ccmSavedShifts = mergedData._ccmMeta.savedShifts;
        lockShift(roleId, shift);

        showMessage(`✅ شیفت ${shift === "day" ? "روز" : "شب"} با موفقیت ثبت شد؛ این شیفت تا پایان امروز قفل شد.`);

    }catch(error){

        console.error(error);
        alert("خطا در ذخیره فرم:\n\n" + error.message);

    }finally{

        hideLoading();

    }
}

// برای سازگاری با دکمه‌های قدیمی
async function saveForm(){
    if(currentAccess && currentAccess.role &&
       currentAccess.role !== "manager" && currentAccess.role !== "supervisor"){
        const dayButton = document.querySelector(`[data-shift-save="${currentAccess.role}_day"]`);
        const nightButton = document.querySelector(`[data-shift-save="${currentAccess.role}_night"]`);
        if(dayButton && !dayButton.disabled){
            await saveShift(currentAccess.role,"day");
            return;
        }
        if(nightButton && !nightButton.disabled){
            await saveShift(currentAccess.role,"night");
            return;
        }
    }

    alert("برای ثبت، از دکمه «ذخیره شیفت روز» یا «ذخیره شیفت شب» استفاده کنید.");
}


/* =========================================================
   LOAD FORM
========================================================= */

async function loadForm(
    formNumber,
    formDate
){

    showLoading();

    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .from("ccm_forms")
                .select("*")
                .eq(
                    "form_number",
                    String(formNumber)
                )
                .eq(
                    "form_date",
                    formDate
                )
                .maybeSingle();


        if(error){

            console.error(error);

            alert(
                "خطا در دریافت فرم:\n\n" +
                error.message
            );

            return;

        }


        if(!data){

            showMessage(
                "فرم موردنظر پیدا نشد"
            );

            return;

        }


        applyFormData(
            data.data
        );


        showMessage(
            "✅ فرم از پایگاه داده بارگذاری شد"
        );


    }catch(error){

        console.error(error);

        alert(
            "خطا در بارگذاری فرم:\n\n" +
            error.message
        );

    }finally{

        hideLoading();

    }

}


/* =========================================================
   APPLY FORM DATA
========================================================= */

function applyFormData(data){

    if(!data){
        return;
    }


    const fields =
        data.fields || {};

    const radios =
        data.radios || {};


    document
        .querySelectorAll("[data-field]")
        .forEach(el => {

            const key =
                el.getAttribute(
                    "data-field"
                );

            if(
                Object.prototype.hasOwnProperty.call(
                    fields,
                    key
                )
            ){

                el.value =
                    fields[key];

            }

        });


    document
        .querySelectorAll(
            'input[type="radio"][data-radio]'
        )
        .forEach(el => {

            const key =
                el.getAttribute(
                    "data-radio"
                );

            el.checked =
                radios[key] === el.value;

        });

}


/* =========================================================
   CHECK FORM WHEN DATE CHANGES
========================================================= */

let formChangeTimer;

function formDateChanged(){

    updateFormNumber();

    clearTimeout(formChangeTimer);

    formChangeTimer = setTimeout(
        async function(){

            const formDate =
                document.getElementById("formDate").value.trim();

            const formNumber =
                document.getElementById("formNumber").value;

            if(!formDate || !formNumber){
                return;
            }

            await checkExistingForm(
                formNumber,
                formDate
            );

        },
        600
    );
}


/* =========================================================
   CHECK EXISTING FORM
========================================================= */

async function checkExistingForm(
    formNumber,
    formDate
){

    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .from("ccm_forms")
                .select("id,data")
                .eq(
                    "form_number",
                    String(formNumber)
                )
                .eq(
                    "form_date",
                    formDate
                )
                .maybeSingle();


        if(error){

            console.error(error);

            return;

        }


        if(data){

            applyFormData(
                data.data
            );

            showMessage(
                "فرم ذخیره‌شده بارگذاری شد"
            );

        }else{

            clearChecklistOnly();

        }

    }catch(error){

        console.error(error);

    }

}


/* =========================================================
   CLEAR CHECKLIST
========================================================= */

function clearChecklistOnly(){

    document
        .querySelectorAll(
            "[data-field]"
        )
        .forEach(el => {

            el.value = "";

        });


    document
        .querySelectorAll(
            'input[type="radio"]'
        )
        .forEach(el => {

            el.checked = false;

        });

}


/* =========================================================
   DELETE CURRENT FORM
========================================================= */

async function clearCurrentForm(){

    if(!currentAccess || !isManagement()){
        alert("شما دسترسی حذف فرم را ندارید.");
        return;
    }

    const formNumber =
        document.getElementById(
            "formNumber"
        ).value;

    const formDate =
        document.getElementById(
            "formDate"
        ).value;


    if(
        !formNumber ||
        !formDate
    ){

        return;

    }


    const confirmed =
        confirm(
            "آیا از حذف کامل این فرم مطمئن هستید؟"
        );


    if(!confirmed){

        return;

    }


    showLoading();


    try{

        const { error } =
            await supabaseClient
                .from("ccm_forms")
                .delete()
                .eq(
                    "form_number",
                    String(formNumber)
                )
                .eq(
                    "form_date",
                    formDate
                );


        if(error){

            console.error(error);

            alert(
                "خطا در حذف فرم:\n\n" +
                error.message
            );

            return;

        }


        clearChecklistOnly();
        setTodayDate();

        showMessage(
            "فرم حذف شد"
        );


    }catch(error){

        console.error(error);

        alert(
            "خطا در حذف فرم:\n\n" +
            error.message
        );

    }finally{

        hideLoading();

    }

}


/* =========================================================
   SEARCH PANEL
========================================================= */

function toggleSearch(){

    if(!currentAccess || !isManagement()){
        return;
    }

    const panel =
        document.getElementById(
            "searchPanel"
        );

    if(
        panel.classList.contains("open")
    ){

        panel.classList.remove("open");

        return;

    }


    panel.classList.add("open");

    loadAllForms();

}


/* =========================================================
   LOAD ALL FORMS
========================================================= */

async function loadAllForms(){

    if(!currentAccess || !isManagement()){
        return;
    }

    const results =
        document.getElementById(
            "searchResults"
        );

    results.innerHTML =
        "در حال دریافت فرم‌ها...";


    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .from("ccm_forms")
                .select(
                    "id,form_number,form_date,updated_at"
                )
                .order(
                    "form_number",
                    {
                        ascending:true
                    }
                );


        if(error){

            console.error(error);

            results.innerHTML =
                "خطا در دریافت فرم‌ها";

            return;

        }


        if(
            !data ||
            data.length === 0
        ){

            results.innerHTML =
                "هنوز فرمی ذخیره نشده است.";

            return;

        }


        results.innerHTML = "";


        data.forEach(item => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "search-item";


            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "search-info";


            let updated = "";

            if(item.updated_at){

                try{

                    updated =
                        new Date(
                            item.updated_at
                        ).toLocaleString(
                            "fa-IR"
                        );

                }catch(e){

                    updated =
                        item.updated_at;

                }

            }


            info.innerHTML =
                `
                <strong>
                    فرم شماره ${item.form_number}
                </strong>
                <br>
                تاریخ: ${item.form_date}
                <br>
                آخرین ویرایش:
                ${updated}
                `;


            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "search-load";

            button.textContent =
                "باز کردن";


            button.onclick =
                function(){

                    document.getElementById(
                        "formNumber"
                    ).value =
                        item.form_number;

                    document.getElementById(
                        "formDate"
                    ).value =
                        item.form_date;

                    loadForm(
                        item.form_number,
                        item.form_date
                    );

                    document
                        .getElementById(
                            "searchPanel"
                        )
                        .classList.remove(
                            "open"
                        );

                };


            div.appendChild(info);

            div.appendChild(button);

            results.appendChild(div);

        });


    }catch(error){

        console.error(error);

        results.innerHTML =
            "خطا در ارتباط با پایگاه داده.";

    }

}
